# 自动生成：不要手改，改 build_tools.py 后重新生成
openapi: 3.0.3
info:
  title: yuejiao_api
  version: 2.0.0
  description: ai智能助手后端接口集合（v2，覆盖学生/员工/客服/内容/线索/申请/通知共 54 个工具）。导入 Dify「工具 → 自定义工具 → 从 OpenAPI/Swagger 导入」后即可在工作流工具节点中调用；创建工具时名称请填写
    yuejiao_api。token 参数由工作流的 auth_token 变量传入。
servers:
- url: http://host.docker.internal:8000
  description: 本地后端（Dify 容器通过 host.docker.internal 访问）
paths:
  /api/actions/prepare:
    post:
      operationId: prepare_business_action
      summary: 通用业务动作准备：补字段、消歧和确认
      description: 通用业务准备工具：补字段、列候选、消歧、生成确认预览，不写正式业务表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 登录令牌。由「开始」节点的 auth_token 变量传入，形如 {{#start_node.auth_token#}}
                visitor_key:
                  type: string
                  description: 公开访客标识；登录用户可留空
                query:
                  type: string
                  description: 用户本轮原话。用于后端日期解析辅助，不能由模型改写
                history:
                  type: string
                  description: 最近几轮用户消息，仅用于补全已经出现过的学生或名称，不得覆盖本轮明确信息
                action_type:
                  type: string
                  description: 业务动作类型：event_register / score_query / score_upsert / score_delete / feedback_create / feedback_cancel
                    / lead_create
                user_action:
                  type: string
                  description: 用户本轮动作：collect / confirm / modify / cancel
                  example: collect
                slots_json:
                  type: string
                  description: Dify LLM 提取的业务字段 JSON 字符串，不得补写用户没有提供的信息
                  example: '{}'
      responses:
        '200':
          description: 处理结果
        '422':
          description: 参数校验失败
  /api/actions/execute:
    post:
      operationId: execute_business_action
      summary: 通用业务动作执行：消费确认令牌后写库
      description: 通用业务执行工具：只接受 prepare_business_action 返回的一次性确认令牌，执行前再次校验权限和数据范围。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirmation_token
              properties:
                token:
                  type: string
                  description: 登录令牌。由「开始」节点的 auth_token 变量传入，形如 {{#start_node.auth_token#}}
                visitor_key:
                  type: string
                  description: 公开访客标识；登录用户可留空
                confirmation_token:
                  type: string
                  description: prepare_leave 返回的一次性确认令牌；只能传回 confirm_leave
      responses:
        '200':
          description: 处理结果
        '422':
          description: 参数校验失败
  /api/student/leave/prepare:
    post:
      operationId: prepare_leave
      summary: Dify 请假编排：准备并归一化草稿
      description: 请假准备工具。接收 Dify 已抽取字段，归一化日期、保存草稿、检查缺失和重叠；绝不创建正式请假单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: 登录令牌。由「开始」节点的 auth_token 变量传入，形如 {{#start_node.auth_token#}}
                query:
                  type: string
                  description: 用户本轮原话。用于后端日期解析辅助，不能由模型改写
                action:
                  type: string
                  description: 用户本轮动作：collect 提供信息 / confirm 确认提交 / modify 修改 / cancel 取消
                  example: collect
                leave_type:
                  type: string
                  description: Dify LLM 提取的请假类型，例如 病假 / 事假；未提供时为空字符串
                start_date:
                  type: string
                  description: Dify LLM 提取或识别的开始日期；不明确时原样放入 date_text
                end_date:
                  type: string
                  description: Dify LLM 提取或识别的结束日期；不明确时由后端日期解析辅助归一化
                date_text:
                  type: string
                  description: 用户原文中的日期表达，例如「下周一到下周三」，交给后端确定性解析
                reason:
                  type: string
                  description: 请假原因原文，例如「明天要去医院复查，请假两天」
      responses:
        '200':
          description: 处理结果
        '422':
          description: 参数校验失败
