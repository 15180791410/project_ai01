    - id: code_profile_extract
      data:
        type: code
        title: 解析结构化画像
        desc: 解析 LLM 输出的结构化画像，禁止猜测缺失字段
        selected: false
        code_language: python3
        code: "def main(profile_json: str) -> dict:\n    import json\n    import re\n    text = (profile_json or '').strip()\n\
          \    text = re.sub(r'^```(?:json)?\\s*', '', text, flags=re.I)\n    text = re.sub(r'\\s*```$', '', text)\n    try:\n\
          \        data = json.loads(text)\n    except Exception:\n        data = {}\n    def value(key):\n        item =\
          \ data.get(key)\n        if item is None:\n            return ''\n        if isinstance(item, bool):\n         \
          \   return 'true' if item else 'false'\n        return str(item)\n    return {\n        'age': value('age'),\n \
          \       'education': value('education'),\n        'intent': value('intent'),\n        'language': value('language'),\n\
          \        'hands_on': value('hands_on'),\n        'economic_condition': value('economic_condition'),\n    }\n"
        variables:
        - variable: profile_json
          value_selector:
          - llm_profile_extract
          - text
        outputs:
          age:
            type: string
            children: null
          education:
            type: string
            children: null
          intent:
            type: string
            children: null
          language:
            type: string
            children: null
          hands_on:
            type: string
            children: null
          economic_condition:
