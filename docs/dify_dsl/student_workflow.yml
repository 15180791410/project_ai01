        title: 解析请假准备结果
        desc: 解析 prepare_leave 的结构化状态和确认令牌
        selected: false
        code_language: python3
        code: "def main(prepare_text: str) -> dict:\n    import json\n    text = (prepare_text or '').strip()\n    try:\n\
          \        payload = json.loads(text)\n        if isinstance(payload, str):\n            payload = json.loads(payload)\n\
          \        if isinstance(payload, dict) and isinstance(payload.get('data'), dict):\n            payload = payload['data']\n\
          \    except Exception:\n        payload = {}\n    if not isinstance(payload, dict):\n        payload = {}\n    fields\
          \ = payload.get('fields') or {}\n    if not isinstance(fields, dict):\n        fields = {}\n    missing = payload.get('missing_fields')\
          \ or []\n    if not isinstance(missing, list):\n        missing = [str(missing)]\n    duplicate = payload.get('duplicate')\
          \ or {}\n    days = fields.get('days')\n    fields_text = '\\n'.join([\n        '请假类型：' + str(fields.get('leave_type')\
          \ or '未提供'),\n        '开始日期：' + str(fields.get('start_date') or '未提供'),\n        '结束日期：' + str(fields.get('end_date')\
          \ or '未提供'),\n        '请假天数：' + ('未计算' if days in (None, '') else str(days)),\n        '请假原因：' + str(fields.get('reason')\
          \ or '未提供'),\n    ])\n    return {\n        'status_token': str(payload.get('status_token') or 'STATE_ERROR'),\n\
          \        'message': str(payload.get('message') or ''),\n        'missing_text': '、'.join(str(v) for v in missing)\
          \ or '无',\n        'fields_text': fields_text,\n        'confirmation_token': str(payload.get('confirmation_token')\
          \ or ''),\n        'duplicate_text': json.dumps(duplicate, ensure_ascii=False) if duplicate else '',\n    }\n"
