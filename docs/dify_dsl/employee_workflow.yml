          \        if isinstance(payload, str): payload = json.loads(payload)\n        if isinstance(payload, dict) and isinstance(payload.get('data'),\
          \ dict): payload = payload['data']\n    except Exception: payload = {}\n    missing = payload.get('missing_fields')\
          \ or []\n    candidates = payload.get('candidates') or []\n    lines = []\n    for item in candidates:\n       \
          \ if isinstance(item, dict): lines.append(str(item.get('label') or item))\n    return {\n        'status_token':\
          \ str(payload.get('status_token') or 'STATE_ERROR'),\n        'message': str(payload.get('message') or ''),\n  \
          \      'preview': str(payload.get('preview') or ''),\n        'missing_text': '、'.join(str(v) for v in missing)\
          \ or '无',\n        'candidates_text': '\\n'.join(lines) or '无',\n        'confirmation_token': str(payload.get('confirmation_token')\
          \ or ''),\n    }\n"
