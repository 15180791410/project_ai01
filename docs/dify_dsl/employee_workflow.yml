    - id: code_action_extract
      data:
        type: code
        title: 解析业务动作字段
        desc: ''
        selected: false
        code_language: python3
        code: "def main(raw: str) -> dict:\n    import json, re\n    text = (raw or '').strip()\n    text = re.sub(r'^```(?:json)?\\\
          s*', '', text, flags=re.I)\n    text = re.sub(r'\\s*```$', '', text)\n    try: data = json.loads(text)\n    except\
          \ Exception: data = {}\n    slots = data.get('slots') if isinstance(data.get('slots'), dict) else {}\n    clean\
          \ = {str(k): v for k, v in slots.items() if v not in (None, '', [], {})}\n    action = str(data.get('user_action')\
          \ or 'collect').lower()\n    if action not in ('collect','confirm','modify','cancel'): action = 'collect'\n    return\
          \ {'action_type': str(data.get('action_type') or ''), 'user_action': action,\n            'slots_json': json.dumps(clean,\
          \ ensure_ascii=False)}\n"
        variables:
        - variable: raw
          value_selector:
          - llm_action_extract
          - text
